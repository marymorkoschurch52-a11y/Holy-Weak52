<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>أسبوع الآلام</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background: radial-gradient(
          circle at center,
          #5c4326 0%,
          #3e2a18 45%,
          #24180e 100%
        );

        color: #ecdfb8;
        font-family: "Georgia", serif;
        overflow: hidden;
      }

      .loading {
        text-align: center;
        animation: fadeIn 2s ease forwards;
      }

      .cross {
        font-size: 70px;
        margin-bottom: 25px;
        opacity: 0.9;

        animation: glow 2s ease-in-out infinite alternate;
      }

      .title {
        font-size: 32px;
        margin-bottom: 15px;
        letter-spacing: 1px;
      }

      .prayer {
        font-size: 24px;
        line-height: 1.8;
        color: #d9c594;
      }

      .dots {
        margin-top: 30px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #ecdfb8;
        border-radius: 50%;
        animation: loading 1.4s infinite ease-in-out;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes loading {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }

        40% {
          opacity: 1;
          transform: translateY(-7px);
        }
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 5px rgba(236, 223, 184, 0.2);
        }

        to {
          text-shadow: 0 0 25px rgba(236, 223, 184, 0.6);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        .cross {
          font-size: 55px;
        }

        .title {
          font-size: 25px;
        }

        .prayer {
          font-size: 19px;
        }
      }

      body {
        opacity: 0;
        animation: pageOpen 1s ease forwards;
      }

      @keyframes pageOpen {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===================== CREDIT ===================== */

      .credit {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);

        font-family: "Georgia", serif;
        font-size: 15px;

        display: inline-flex;
        align-items: center;
        gap: 8px;

        padding: 8px 20px;
        border-radius: 30px;

        border: 1px solid rgba(236, 223, 184, 0.25);
        background: rgba(236, 223, 184, 0.06);

        color: #d9c594;
      }

      .credit .heart {
        display: inline-block;
        animation: beat 1.2s ease-in-out infinite;
      }

      .credit .name {
        background: linear-gradient(
          90deg,
          #a8873c,
          #ecdfb8,
          #d9c594,
          #ecdfb8,
          #a8873c
        );
        background-size: 300% auto;

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        font-weight: 700;

        animation: shine 4s linear infinite;
      }

      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.25);
        }
      }

      @keyframes shine {
        to {
          background-position: 300% center;
        }
      }

      @media (max-width: 600px) {
        .credit {
          font-size: 13px;
          padding: 7px 16px;
          bottom: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="loading">
      <div class="cross">✝</div>

      
<div class="title">المسيح مخلصنا جاء وتألم عنا</div>

<div class="prayer">
 
  فلنمجده ونرفع اسمه لأنه صنع معنا رحمة كعظيم رحمته
</div>


      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="credit">
      <span class="heart">✝</span>
      <span class="name">Mina Hany</span> Made by
      <span class="heart">✝</span>
    </div>

    <script>
      setTimeout(() => {
        window.location.href = "home.html";
      }, 3000);
    </script>
  </body>
</html>
